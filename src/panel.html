<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>tabmv</title>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="tab-preview" title="标签会显示成这样">
    <img id="pvIcon" alt="" />
    <span id="pvTitle">…</span>
  </div>
  <div id="now" class="now"></div>
  <div id="blocked" class="card warn" hidden>这个页面（浏览器设置页、扩展商店等）不允许扩展修改，换一个普通网页试试。</div>

  <section>
    <h3>标签名</h3>
    <div id="composer" class="composer" contenteditable="true" spellcheck="false" data-placeholder="直接输入名字，或插入下面的内容"></div>
    <div class="insert">
      <button id="pick">👆 页面上的文字</button>
      <button id="fromUrl">🔗 网址里的一段</button>
      <button id="addTitle">📄 原标题</button>
    </div>
    <div id="urlPieces" class="url-pieces" hidden></div>
    <div id="tokenCard" class="card token-card" hidden></div>
  </section>

  <section>
    <h3>应用于</h3>
    <select id="scope"></select>
    <input id="customPattern" type="text" class="mono" hidden placeholder="*://*.baidu.com/*  或  /正则/" />
    <div id="scopeCheck" class="sub"></div>
  </section>

  <details id="iconBox">
    <summary>图标 <span id="iconSummary" class="sub"></span></summary>
    <div class="sub">色点</div>
    <div id="colors" class="swatches"></div>
    <div class="sub">换成</div>
    <div id="icons" class="swatches"></div>
    <input id="iconCustom" type="text" placeholder="其他 emoji、1–2 个字，或图片网址" />
  </details>

  <div id="summary" class="card summary"></div>
  <div class="actions">
    <button id="save" class="primary big">保存</button>
    <button id="saveNew" hidden>另存为新规则</button>
    <button id="reset">恢复原样</button>
  </div>
  <div id="msg" class="msg"></div>

  <details id="adv">
    <summary>高级：规则文本</summary>
    <textarea id="ruleText" class="mono" rows="3" spellcheck="false"></textarea>
    <div id="advNote" class="sub"></div>
  </details>
  <p class="footer"><a id="openOptions" href="#">管理全部规则 →</a></p>

  <script src="rules.js"></script>
  <script src="store.js"></script>
  <script src="panel.js"></script>
</body>
</html>
