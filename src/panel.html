<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>tabmv</title>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="tab-preview" data-i18n-title="p_preview">
    <img id="pvIcon" alt="" />
    <span id="pvTitle">…</span>
  </div>
  <div id="now" class="now"></div>
  <div id="blocked" class="card warn" hidden data-i18n="p_blocked"></div>

  <section>
    <h3 data-i18n="p_name"></h3>
    <div id="composer" class="composer" contenteditable="true" spellcheck="false" data-placeholder=""></div>
    <div class="insert">
      <button id="pick" data-i18n="pick"></button>
      <button id="fromUrl" data-i18n="p_from_url"></button>
      <button id="addTitle" data-i18n="p_add_title"></button>
    </div>
    <div id="urlPieces" class="url-pieces" hidden></div>
    <div id="tokenCard" class="card token-card" hidden></div>
  </section>

  <section>
    <h3 data-i18n="p_apply"></h3>
    <select id="scope"></select>
    <input id="customPattern" type="text" class="mono" hidden placeholder="*://*.baidu.com/*  或  /正则/" />
    <div id="scopeCheck" class="sub"></div>
  </section>

  <details id="iconBox">
    <summary><span data-i18n="p_icon"></span> <span id="iconSummary" class="sub"></span></summary>
    <div class="sub" data-i18n="p_dot"></div>
    <div id="colors" class="swatches"></div>
    <div class="sub" data-i18n="p_replace"></div>
    <div id="icons" class="swatches"></div>
    <input id="iconCustom" type="text" data-i18n-placeholder="p_icon_ph" />
  </details>

  <div id="summary" class="card summary"></div>
  <div class="actions">
    <button id="save" class="primary big" data-i18n="btn_save"></button>
    <button id="saveNew" hidden data-i18n="btn_save_new"></button>
    <button id="reset" data-i18n="p_reset"></button>
  </div>
  <div id="msg" class="msg"></div>

  <details id="adv">
    <summary data-i18n="p_adv"></summary>
    <textarea id="ruleText" class="mono" rows="3" spellcheck="false"></textarea>
    <div id="advNote" class="sub"></div>
  </details>
  <p class="footer"><a id="openOptions" href="#" data-i18n="p_manage"></a></p>

  <script src="i18n.js"></script>
  <script src="rules.js"></script>
  <script src="store.js"></script>
  <script src="panel.js"></script>
</body>
</html>
