name: Release

# Push a tag like v1.0.1 (matching manifest.json "version") to build, create a
# GitHub Release with the zip, and, when the store secrets are set, upload the
# zip to the Chrome Web Store and submit it for review. See docs/publishing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to the Chrome Web Store and submit for review'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      HAS_SA_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8');const m=s.split(/^## /m).find(x=>x.startsWith('${{ steps.v.outputs.version }}'));process.stdout.write(m?m.split('\n').slice(1).join('\n').trim():'')" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Telltab $GITHUB_REF_NAME" --notes-file notes.md

      # Option A: service account key (JSON) in CWS_SERVICE_ACCOUNT_KEY.
      - name: Service account token
        id: sa
        if: env.HAS_SA_KEY == 'true' && (github.ref_type == 'tag' || inputs.publish)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      # Option B: OAuth client + refresh token (CWS_CLIENT_ID / _SECRET / _REFRESH_TOKEN).
      - name: Chrome Web Store
        if: env.CWS_EXTENSION_ID != '' && (github.ref_type == 'tag' || inputs.publish)
        env:
          CWS_ACCESS_TOKEN: ${{ steps.sa.outputs.access_token }}
        run: node scripts/cws-publish.cjs dist/telltab-${{ steps.v.outputs.version }}.zip

      - name: Store publishing skipped
        if: env.CWS_EXTENSION_ID == ''
        run: echo "::notice::CWS_EXTENSION_ID is not set, so the zip was not sent to the Chrome Web Store. See docs/publishing.md."
