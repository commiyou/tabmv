<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="ui.css" />
  <style>body { width: 380px; padding: 10px 12px; }</style>
</head>
<body>
  <div id="url" class="mono muted" style="word-break: break-all"></div>
  <div id="status" class="muted" style="margin-top: 2px"></div>

  <label for="title">Title（模板：$title 原标题、${q.key} 查询参数、$1 捕获组）</label>
  <input id="title" type="text" class="mono" autofocus />
  <div id="qchips" class="chips"></div>

  <div class="row">
    <div class="grow">
      <label for="icon">Icon（emoji / letter / 图片 URL，留空=原图标）</label>
      <input id="icon" type="text" />
    </div>
    <div style="width: 120px">
      <label for="color">Color（auto / #hex）</label>
      <div class="row"><input id="color" type="text" class="grow" /><input id="picker" type="color" class="swatch" /></div>
    </div>
  </div>

  <div class="row" style="margin-top: 8px">
    <button id="applyTab" class="primary" title="Enter">仅此标签</button>
    <button id="resetTab">恢复此标签</button>
    <span class="grow"></span>
    <a id="openOptions" href="#">编辑全部规则</a>
  </div>

  <hr />
  <label for="pattern">保存为规则：URL pattern（glob 或 /regex/）</label>
  <input id="pattern" type="text" class="mono" />
  <div id="pchips" class="chips"></div>
  <div id="preview" class="preview mono"></div>
  <div class="row" style="margin-top: 8px">
    <button id="saveRule" class="primary" title="Ctrl/⌘+Enter">保存规则</button>
    <span id="msg" class="muted"></span>
  </div>

  <script src="rules.js"></script>
  <script src="store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
