<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Telltab</title>
  <link rel="stylesheet" href="ui.css" />
  <style>
    body { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    textarea { height: 300px; white-space: pre; tab-size: 4; }
    table { border-collapse: collapse; width: 100%; margin-top: 6px; }
    td, th { text-align: left; padding: 3px 6px; border-bottom: 1px solid #8883; vertical-align: top; word-break: break-all; }
    th { color: var(--muted); font-weight: normal; }
    .help code { background: #8882; padding: 0 3px; border-radius: 3px; }
    .help td:first-child { white-space: nowrap; }
  </style>
</head>
<body>
  <div class="row"><h2 class="grow" data-i18n="o_title"></h2><a id="tutorial" target="_blank" data-i18n="o_tutorial"></a></div>
  <p class="muted" data-i18n-html="o_intro"></p>
  <textarea id="rules" spellcheck="false"></textarea>
  <div class="row" style="margin-top: 6px">
    <button id="save" class="primary" data-i18n="o_save"></button>
    <span id="msg" class="muted"></span>
  </div>
  <div id="errors" class="err"></div>

  <h3 data-i18n="o_test"></h3>
  <div class="row">
    <input id="tUrl" type="text" class="mono grow" placeholder="URL" />
    <input id="tTitle" type="text" class="grow" style="max-width: 260px" data-i18n-placeholder="o_test_title" />
  </div>
  <div id="tOut" class="preview mono"></div>

  <h3 data-i18n="o_tabs"></h3>
  <table><thead><tr><th data-i18n="o_col_line"></th><th data-i18n="o_col_orig"></th><th data-i18n="o_col_new"></th><th>icon / color</th></tr></thead><tbody id="tabs"></tbody></table>

  <h3 data-i18n="o_syntax"></h3>
  <table class="help">
    <tr><td colspan="2" data-i18n-html="h_match"></td></tr>
    <tr><td><code>*</code> <code>?</code> <code>[a-z]</code> <code>[!&amp;]</code></td><td data-i18n-html="h_glob"></td></tr>
    <tr><td><code>{a,b}</code> <code>(a|b)</code></td><td data-i18n-html="h_alt"></td></tr>
    <tr><td data-i18n-html="h_auto_k"></td><td data-i18n-html="h_auto"></td></tr>
    <tr><td><code>(#i)</code></td><td data-i18n-html="h_case"></td></tr>
    <tr><td><code>/regex/i</code></td><td data-i18n-html="h_regex"></td></tr>
    <tr><td><code>title:</code></td><td data-i18n-html="h_titlef"></td></tr>
    <tr><td colspan="2" data-i18n-html="h_name"></td></tr>
    <tr><td><code>{page ".title"}</code></td><td data-i18n-html="h_page"></td></tr>
    <tr><td><code>{?env}</code></td><td data-i18n-html="h_param"></td></tr>
    <tr><td><code>{host} {host[1]} {host[-2]}</code></td><td data-i18n-html="h_host"></td></tr>
    <tr><td><code>{path} {path[2]}</code></td><td data-i18n-html="h_path"></td></tr>
    <tr><td><code>{title} {url}</code></td><td data-i18n-html="h_titlev"></td></tr>
    <tr><td><code>{1} {&lt;name&gt;}</code></td><td data-i18n-html="h_cap"></td></tr>
    <tr><td><code>A or B or "text"</code></td><td data-i18n-html="h_or"></td></tr>
    <tr><td><code>before "." after "-"</code></td><td data-i18n-html="h_cut"></td></tr>
    <tr><td><code>match /#(\d+)/</code></td><td data-i18n-html="h_matchf"></td></tr>
    <tr><td><code>replace /re/ "x"</code> <code>upper lower trim max 20</code></td><td data-i18n-html="h_more"></td></tr>
    <tr><td data-i18n-html="h_old_k"></td><td data-i18n-html="h_old"></td></tr>
    <tr><td><code>icon=</code></td><td data-i18n-html="h_icon"></td></tr>
    <tr><td><code>color=</code></td><td data-i18n-html="h_color"></td></tr>
  </table>

  <script src="i18n.js"></script>
  <script src="rules.js"></script>
  <script src="store.js"></script>
  <script src="options.js"></script>
</body>
</html>
